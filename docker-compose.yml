services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - STELLAR_NETWORK=testnet
      - STELLAR_HORIZON_URL=https://horizon-testnet.stellar.org
      - STELLAR_RPC_URL=https://soroban-testnet.stellar.org
      - PAYROLL_CONTRACT_ID=${PAYROLL_CONTRACT_ID}
      - STREAM_CONTRACT_ID=${STREAM_CONTRACT_ID}
      - DATABASE_URL=postgresql://payroll:payroll@db:5432/stellar_payroll
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payroll
      POSTGRES_PASSWORD: payroll
      POSTGRES_DB: stellar_payroll
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
